<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>BLOCKY ROLL — Roll the ball to the portal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #1b1b24; cursor: crosshair;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  #game { display: block; position: fixed; inset: 0; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0; padding: 14px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    pointer-events: none; z-index: 5;
  }
  #toprow { display: flex; align-items: center; gap: 10px; }
  .chip {
    background: rgba(12,14,20,.72); border: 2px solid rgba(0,0,0,.55);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.35), inset 0 2px 0 rgba(255,255,255,.12);
    color: #f4f4e8; font-size: 12px; font-weight: 700; letter-spacing: 1.6px;
    text-transform: uppercase; padding: 7px 12px; border-radius: 3px;
    text-shadow: 2px 2px 0 rgba(0,0,0,.6);
  }
  .chip b { color: #ffe57a; }
  #barwrap {
    width: min(62vw, 520px); height: 14px; background: rgba(12,14,20,.72);
    border: 2px solid rgba(0,0,0,.6); border-radius: 3px; padding: 2px;
    box-shadow: inset 0 2px 0 rgba(0,0,0,.4);
  }
  #fill {
    height: 100%; width: 0%; border-radius: 1px;
    background: linear-gradient(180deg, #a6f56a, #57a52c 60%, #3d7a1e);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.35);
    transition: width .08s linear;
  }

  #hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    color: #fff; font-size: 11px; letter-spacing: 1.6px; text-transform: uppercase;
    background: rgba(12,14,20,.7); padding: 9px 14px; border-radius: 3px;
    border: 2px solid rgba(0,0,0,.55); text-shadow: 2px 2px 0 rgba(0,0,0,.6);
    pointer-events: none; z-index: 5; text-align: center; line-height: 1.7;
    transition: opacity .5s ease; white-space: nowrap;
  }
  #hint.dim { opacity: .28; }

  #center {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; z-index: 6;
    text-align: center; padding: 24px; pointer-events: none;
    background: radial-gradient(circle at 50% 45%, rgba(6,8,14,.55), rgba(6,8,14,.85));
    opacity: 1; transition: opacity .35s ease;
  }
  #center.hidden { opacity: 0; }
  #center h1 {
    font-size: clamp(26px, 6.5vw, 58px); color: #fff; letter-spacing: 3px;
    text-transform: uppercase; font-weight: 800; line-height: 1.15;
    text-shadow: 0 4px 0 #2f4a1c, 0 8px 0 rgba(0,0,0,.45), 0 0 40px rgba(160,240,120,.35);
  }
  #center h1 span { color: #ffe57a; }
  #center p {
    font-size: clamp(11px, 2.4vw, 14px); color: #cfd8c5; letter-spacing: 2px;
    text-transform: uppercase; line-height: 2; max-width: 620px;
  }
  #center p b { color: #a6f56a; }
  #center .key {
    display: inline-block; border: 2px solid #7d8a70; border-bottom-width: 4px;
    border-radius: 3px; padding: 2px 7px; margin: 0 2px; color: #fff;
    background: rgba(255,255,255,.07); font-size: .95em;
  }
  #startbtn {
    pointer-events: auto; cursor: pointer; margin-top: 6px;
    font-family: inherit; font-weight: 800; font-size: 14px; letter-spacing: 2px;
    text-transform: uppercase; color: #16240c; padding: 14px 30px;
    background: linear-gradient(180deg, #b6f97c, #6dc235); border: 2px solid #33531b;
    border-radius: 4px; box-shadow: 0 6px 0 #33531b, 0 10px 20px rgba(0,0,0,.4);
    transition: transform .07s ease, box-shadow .07s ease;
  }
  #startbtn:active { transform: translateY(4px); box-shadow: 0 2px 0 #33531b; }
  #center.hidden #startbtn { display: none; }

  #flash {
    position: fixed; inset: 0; z-index: 7; pointer-events: none;
    background: #e8d5ff; opacity: 0;
  }

  #toast {
    position: fixed; left: 50%; top: 24%; transform: translate(-50%, -50%);
    z-index: 6; text-align: center; pointer-events: none; opacity: 0;
    transition: opacity .35s ease, transform .35s ease;
  }
  #toast.show { opacity: 1; }
  #toast .lt {
    font-size: clamp(20px, 5vw, 42px); font-weight: 800; letter-spacing: 5px;
    color: #fff; text-transform: uppercase;
    text-shadow: 0 4px 0 #2b4a19, 0 9px 22px rgba(0,0,0,.65);
  }
  #toast .ls {
    margin-top: 8px; font-size: 11px; letter-spacing: 3px; color: #b6f97c;
    text-transform: uppercase; text-shadow: 0 2px 0 rgba(0,0,0,.7);
  }
  .shake { animation: sh .25s linear; }
  @keyframes sh { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-3px,2px)} 50%{transform:translate(3px,-2px)} 75%{transform:translate(-2px,-1px)} }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="toprow">
    <div class="chip">LEVEL <b id="lvlNum">1</b> / 6</div>
    <div class="chip" id="lvlName">MEADOW</div>
    <div class="chip">BUMPS <b id="bumps">0</b></div>
  </div>
  <div id="barwrap"><div id="fill"></div></div>
</div>

<div id="hint">SCROLL DOWN to roll &nbsp;·&nbsp; <span style="color:#a6f56a">A / D</span> or <span style="color:#a6f56a">← →</span> to steer</div>

<div id="flash"></div>
<div id="toast"><div class="lt"></div><div class="ls"></div></div>

<div id="center">
  <h1>BLOCKY<span>ROLL</span></h1>
  <p>Roll the slime ball along the floating<br>sky-bridge and into the portal at the end.<br>6 levels. Each one gets meaner.</p>
  <p><b>SCROLL</b> to roll &nbsp; <span class="key">A</span><span class="key">D</span> / <span class="key">←</span><span class="key">→</span> to steer</p>
  <button id="startbtn">START ROLLING</button>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ *
 *  BLOCKY ROLL — one-file game. No assets, no dependencies.
 *  Scroll down to roll the ball down a wiggly path into the portal.
 * ------------------------------------------------------------------ */

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
const UI = {
  lvlNum: document.getElementById('lvlNum'),
  lvlName: document.getElementById('lvlName'),
  bumps: document.getElementById('bumps'),
  fill: document.getElementById('fill'),
  hint: document.getElementById('hint'),
  center: document.getElementById('center'),
  centerH: document.querySelector('#center h1'),
  centerP: document.querySelector('#center p'),
  startBtn: document.getElementById('startbtn'),
  flash: document.getElementById('flash'),
};

let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cvs.width = Math.max(1, Math.floor(W * DPR));
  cvs.height = Math.max(1, Math.floor(H * DPR));
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);

const BALL_R = 15;
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

/* Deterministic hash -> [0,1) so terrain never flickers between frames. */
function hash2(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return n - Math.floor(n);
}

/* ---------------------------- THEMES ------------------------------ */
const THEMES = {
  day: {
    sky: ['#5eb8ff', '#c9ecff'], star: false,
    ground: ['#7cc15a', '#74b954', '#6aae4b', '#63a446', '#5c9a41', '#83c761'],
    path: ['#d8bd8a', '#cfb27c', '#c8a86f', '#e0c795'],
    edge: ['#9d9d9d', '#8a8a8a', '#787878', '#adadad'],
    trunk: '#6b4a24', leaf: ['#3f8f2e', '#4da33a', '#357c27'],
    flower: ['#e8483c', '#f2d13b', '#7fd4f0', '#e9e9e9'],
    water: ['#3f7fd4', '#4f92e0'], vignette: 'rgba(20,40,10,.25)',
  },
  forest: {
    sky: ['#4f9f5e', '#9fd77f'], star: false,
    ground: ['#5f9f49', '#57953f', '#4f8a39', '#67aa50', '#456f31', '#6bb053'],
    path: ['#b99a68', '#ae8f5d', '#a3854f', '#c2a473'],
    edge: ['#8b8b8b', '#797979', '#666', '#9a9a9a'],
    trunk: '#5b3f1f', leaf: ['#357c27', '#2c6b20', '#3f8f2e'],
    flower: ['#e8483c', '#f2d13b', '#d9d9d9', '#c46bd4'],
    water: ['#2f6dbd', '#3f81d4'], vignette: 'rgba(8,30,10,.4)',
  },
  sunset: {
    sky: ['#ff9a4d', '#ffd9a0'], star: false,
    ground: ['#9c7a4e', '#8f6f45', '#82643c', '#a8885a', '#755a34', '#a17f52'],
    path: ['#e0c491', '#d5b884', '#cbae77', '#e8d0a2'],
    edge: ['#a58a70', '#91775e', '#7d654e', '#b39a80'],
    trunk: '#5a3a1c', leaf: ['#a86a25', '#c07f2c', '#8d5518'],
    flower: ['#f2d13b', '#ff8a4a', '#e8483c', '#ffe9a8'],
    water: ['#5a7bb5', '#6d8fc9'], vignette: 'rgba(80,30,0,.28)',
  },
  night: {
    sky: ['#0b1230', '#1c2b57'], star: true,
    ground: ['#2f4a33', '#2a422e', '#243a29', '#35543a', '#1f3324', '#3a5c40'],
    path: ['#6c6257', '#645a50', '#5c534a', '#736a5e'],
    edge: ['#5b5b68', '#4d4d59', '#40404a', '#686876'],
    trunk: '#3a2712', leaf: ['#24541b', '#1c4615', '#2d6521'],
    flower: ['#7fd4f0', '#c46bd4', '#e9e9e9', '#5f8dd4'],
    water: ['#1d3f74', '#264f8c'], vignette: 'rgba(0,4,20,.5)',
  },
  nether: {
    sky: ['#4b0d0d', '#8c1f14'], star: false,
    ground: ['#7d2a26', '#712421', '#65201d', '#8a3530', '#591b19', '#83302b'],
    path: ['#8a4a3c', '#7d4235', '#713b2f', '#935245'],
    edge: ['#5a2a24', '#4c231e', '#3f1d19', '#66322a'],
    trunk: '#3d2018', leaf: ['#9c5a2a', '#7d3f1c', '#b06a30'],
    flower: ['#ff7a3c', '#ffb03c', '#ff4d2e', '#ffd97a'],
    water: ['#d4562a', '#e86a35'], vignette: 'rgba(60,0,0,.45)',
  },
  end: {
    sky: ['#120b22', '#2b1d47'], star: true,
    ground: ['#c9c3a8', '#bdb79c', '#b1ab90', '#d5cfb4', '#a59f84', '#cdc7ac'],
    path: ['#8c86b0', '#7f79a3', '#736d96', '#9a94bd'],
    edge: ['#5b3f6b', '#4d3559', '#402c48', '#6b4c7d'],
    trunk: '#3f2d1c', leaf: ['#7a4fa3', '#653d8c', '#8d5fbd'],
    flower: ['#e848e0', '#9c6bff', '#e9e9e9', '#ffd93c'],
    water: ['#5a3f9c', '#6b4fb0'], vignette: 'rgba(10,0,25,.5)',
  },
};

/* ---------------------------- LEVELS ------------------------------ *
 * len    world length (how far you scroll)
 * amp    how wide the path wiggles
 * freq   how tight the wiggles are
 * half   corridor half-width (smaller = harder)
 * narrow how much the corridor pinches (0..0.2)
 * obs    number of sliding blocks
 *
 * amp * freq * 1.463 is the path's steepest sideways slope (world x per
 * world y). It is tuned upward level by level but stays under the ball's
 * top sideways speed, so a good player can always follow the path.
 * ------------------------------------------------------------------ */
const LEVELS = [
  { name: 'MEADOW',       len: 2800, amp:  91, freq: 0.00337, half: 88, narrow: 0.00, theme: 'day',    obs: 0 },
  { name: 'FOREST',       len: 3100, amp: 112, freq: 0.00365, half: 76, narrow: 0.05, theme: 'forest', obs: 3 },
  { name: 'SUNSET RIDGE', len: 3400, amp: 139, freq: 0.00370, half: 66, narrow: 0.08, theme: 'sunset', obs: 6 },
  { name: 'NIGHT CAVES',  len: 3700, amp: 172, freq: 0.00357, half: 58, narrow: 0.11, theme: 'night',  obs: 8 },
  { name: 'THE NETHER',   len: 4000, amp: 207, freq: 0.00346, half: 52, narrow: 0.14, theme: 'nether', obs: 10 },
  { name: 'THE END',      len: 4300, amp: 244, freq: 0.00336, half: 47, narrow: 0.17, theme: 'end',    obs: 12 },
];

/* Path centre line, in world x, for a given world y. Two harmonics
 * make it read as an organic wiggly path rather than a plain sine. */
function cxAt(y, L) {
  const base = Math.sin(y * L.freq) * L.amp;
  const wobble = Math.sin(y * L.freq * 0.47 + 1.3) * L.amp * 0.5;
  const ripple = Math.sin(y * L.freq * 1.9 + 0.6) * L.amp * 0.12;
  return base + wobble + ripple;
}

/* Corridor half-width at a given world y (pinches on harder levels). */
function halfAt(y, L) {
  if (!L.narrow) return L.half;
  const pinch = 0.5 + 0.5 * Math.sin(y * 0.0034 + 2.0);
  return L.half * (1 - L.narrow * pinch);
}

/* ----------------------------- STATE ------------------------------ */
const game = {
  level: 0, y: 0, scroll: 0, x: 0, vx: 0,
  camX: 0, camY: 0, shake: 0, time: 0,
  state: 'menu',           // menu | play | teleport | win
  stateT: 0, bumps: 0, bumpCd: 0,
  obstacles: [],
};

const level = () => LEVELS[game.level];
const keys = { left: false, right: false, up: false, down: false, hold: false };

/* Sliding blocks. A block's centre stays inside the strip [left wall +
 * w/2, left wall + w/2 + travel], and its width plus travel is capped by
 * the corridor width minus GAP — so whichever side the block is on, at
 * least GAP px of free path is always left for the ball. */
const GAP = BALL_R * 2 + 14;
function buildObstacles(L) {
  const list = [];
  for (let i = 0; i < L.obs; i++) {
    const t = (i + 0.75) / (L.obs + 0.55);
    const y = clamp(L.len * t + (hash2(i * 3.7, 11.3) - 0.5) * 200, 600, L.len - 600);
    const cx = cxAt(y, L), hw = halfAt(y, L);
    const room = 2 * hw - GAP;                       // space the block may occupy
    if (room < 34) continue;                         // corridor too tight — no block here
    const w = Math.min(96, room * 0.62);
    list.push({
      y, w, h: 26, travel: room - w,
      cx, hw, baseX: cx - hw + w / 2,
      spd: 0.7 + hash2(i * 5.1, 2.2) * 0.9,
      phase: hash2(i * 2.3, 7.7) * TAU,
      kind: i % 3,
    });
  }
  return list;
}
function obstacleX(o) {
  return o.baseX + (0.5 + 0.5 * Math.sin(game.time * o.spd + o.phase)) * o.travel;
}
/* How much free path is left on each side of a block right now. */
function blockRooms(o) {
  const ox = obstacleX(o);
  return { left: (ox - o.w / 2) - (o.cx - o.hw), right: (o.cx + o.hw) - (ox + o.w / 2) };
}

/* =========================== RENDER =============================== *
 * Blocky 3D. Everything solid is an axis-aligned box, pushed through one
 * perspective camera that flies just behind the ball, then painted back
 * to front (painter's algorithm). The corridor is a Minecraft bridge
 * floating in the sky: there is no ground under it anywhere — only haze,
 * clouds and drifting islands far below.
 * ------------------------------------------------------------------ */

const PATH_TOP = 26;             // how thick the bridge slab is (the ball rolls on top)
const CAM_UP = 180;              // camera height above the path surface
const LOOK_AHEAD = 145;          // camera aims this far in front of the ball
const FOC_MUL = 0.86;            // focal length = this * window height
const NEAR = 26;                 // near clipping distance
const FOG_START = 300, FOG_END = 1150, FOG_CULL = 1140;
const BX = 26, BROW = 26;        // bridge block width / row spacing
const WALL_H = 44;               // corridor wall height
const CAM_LAG = 46;              // how far the camera may trail the ball sideways

const cam = { x: 0, y: 0, z: 0, pitch: 0.4, cp: 1, sp: 0, foc: 600, hz: 0, shx: 0, shy: 0 };

function aimCamera() {
  cam.z = PATH_TOP + CAM_UP;
  cam.y = game.camY;
  cam.x = game.x + clamp(game.camX - game.x, -CAM_LAG, CAM_LAG);
  const dy = (game.y + LOOK_AHEAD) - cam.y;
  cam.pitch = clamp(Math.atan2(CAM_UP, Math.max(70, dy)), 0.15, 1.1);
  cam.cp = Math.cos(cam.pitch);
  cam.sp = Math.sin(cam.pitch);
  cam.foc = H * FOC_MUL;
  cam.hz = H * 0.5 - cam.foc * Math.tan(cam.pitch);    // screen y of the horizon
  cam.shx = 0; cam.shy = 0;
}

/* World point -> screen x/y (written into out), returns its depth, or -1
 * when it is behind the camera. */
function project(wx, wy, wz, out) {
  const dx = wx - cam.x, dy = wy - cam.y, dz = wz - cam.z;
  const dep = dy * cam.cp - dz * cam.sp;
  if (dep < NEAR) return -1;
  const s = cam.foc / dep;
  out[0] = W * 0.5 + cam.shx + dx * s;
  out[1] = H * 0.5 + cam.shy - (dy * cam.sp + dz * cam.cp) * s;
  return dep;
}
function screenOf(x, y, z) {
  const o = [0, 0], d = project(x, y, z || 0, o);
  return d > 0 ? { x: o[0], y: o[1], d: d } : null;
}

/* --------------------------- COLOUR ------------------------------- */
const rgbCache = new Map();
function rgbOf(hex) {
  let v = rgbCache.get(hex);
  if (!v) {
    let s = String(hex).replace('#', '');
    if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
    const n = parseInt(s, 16);
    v = [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    rgbCache.set(hex, v);
  }
  return v;
}
const shade = (c, k) => [clamp(c[0] * k, 0, 255), clamp(c[1] * k, 0, 255), clamp(c[2] * k, 0, 255)];
const mixRGB = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = c => 'rgb(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ')';

const PAL = {
  path: [], edge: [], rock: [], grass: [], cloud: [], ball: [],
  haze: [0, 0, 0], skyTop: [0, 0, 0], skyBot: [0, 0, 0],
  skyBelow: '#000', star: false, key: '',
};
function buildPalette(th) {
  PAL.path = th.path.map(rgbOf);
  PAL.edge = th.edge.map(rgbOf);
  PAL.rock = th.ground.map(c => shade(rgbOf(c), 0.42));
  PAL.grass = th.ground.map(rgbOf);
  PAL.haze = rgbOf(th.sky[1]);
  PAL.skyTop = rgbOf(th.sky[0]);
  PAL.skyBot = rgbOf(th.sky[1]);
  PAL.cloud = [
    mixRGB([255, 255, 255], PAL.haze, 0.16),
    mixRGB([246, 248, 255], PAL.haze, 0.30),
    mixRGB([255, 255, 255], PAL.haze, 0.42),
  ];
  PAL.ball = [rgbOf('#c6ff8a'), rgbOf('#7fd23f'), rgbOf('#41801f')];
  PAL.skyBelow = css(mixRGB(PAL.skyBot, PAL.skyTop, 0.22));
  PAL.deep = css(shade(PAL.skyBot, 0.72));
  PAL.star = !!th.star;
  PAL.key = th.sky[0] + th.sky[1];
  colCache.clear();
}

const colCache = new Map();
/* Fog: far blocks fade into the haze so the bridge dissolves into the sky. */
function tone(c, dep) {
  const t = (dep - FOG_START) / (FOG_END - FOG_START);
  const b = t <= 0 ? 0 : (t >= 1 ? 8 : (t * 8) | 0);
  const key = (((c[0] | 0) << 16) | ((c[1] | 0) << 8) | (c[2] | 0)) * 9 + b;
  let s = colCache.get(key);
  if (s === undefined) {
    const k = b / 8, h = PAL.haze;
    s = css([c[0] + (h[0] - c[0]) * k, c[1] + (h[1] - c[1]) * k, c[2] + (h[2] - c[2]) * k]);
    colCache.set(key, s);
  }
  return s;
}
/* Rough view depth of a world point, for picking its fog tint. */
function depthAt(x, y, z) {
  return (y - cam.y) * cam.cp - (z - cam.z) * cam.sp;
}

/* --------------------------- FACES -------------------------------- */
/* Face records are pooled and reused every frame: the renderer pushes a
 * few hundred of them per frame and only the sort order changes. */
const pool = [];
let nF = 0;
function newFace() {
  let f = pool[nF];
  if (!f) f = pool[nF] = { d: 0, kind: 0, c: '', a: '', p: [0, 0, 0, 0, 0, 0, 0, 0] };
  nF++;
  return f;
}
const _p = [0, 0];
const offscreen = p => (p[0] < 0 && p[2] < 0 && p[4] < 0 && p[6] < 0) ||
                       (p[0] > W && p[2] > W && p[4] > W && p[6] > W) ||
                       (p[1] < 0 && p[3] < 0 && p[5] < 0 && p[7] < 0) ||
                       (p[1] > H && p[3] > H && p[5] > H && p[7] > H);

function quad(ax, ay, az, bx, by, bz, cx, cy, cz, dx, dy, dz, col) {
  let d = project(ax, ay, az, _p); if (d < 0) return;
  const f = newFace(), p = f.p;
  p[0] = _p[0]; p[1] = _p[1];
  if (project(bx, by, bz, _p) < 0) { nF--; return; }
  p[2] = _p[0]; p[3] = _p[1];
  if (project(cx, cy, cz, _p) < 0) { nF--; return; }
  p[4] = _p[0]; p[5] = _p[1];
  if (project(dx, dy, dz, _p) < 0) { nF--; return; }
  p[6] = _p[0]; p[7] = _p[1];
  if (offscreen(p)) { nF--; return; }
  f.d = d; f.kind = 0; f.c = col;
}

/* One shaded cube: top, near face and whichever side face the camera can
 * see. A null colour skips that face (interior blocks of the slab). */
function box(cx, cy, cz, sx, sy, sz, top, side, front) {
  const x0 = cx - sx * 0.5, x1 = cx + sx * 0.5;
  const y0 = cy - sy * 0.5, y1 = cy + sy * 0.5;
  const z0 = cz, z1 = cz + sz;
  const t = top ? tone(top, depthAt(cx, cy, cz + sz)) : null;
  const s = side ? tone(side, depthAt(cx, cy, cz)) : null;
  const n = front ? tone(front, depthAt(cx, cy, cz)) : null;
  if (t) quad(x0, y0, z1, x1, y0, z1, x1, y1, z1, x0, y1, z1, t);
  if (n) quad(x0, y0, z0, x1, y0, z0, x1, y0, z1, x0, y0, z1, n);
  if (s && cam.x < x0) quad(x0, y0, z0, x0, y1, z0, x0, y1, z1, x0, y0, z1, s);
  else if (s && cam.x > x1) quad(x1, y0, z0, x1, y1, z0, x1, y1, z1, x1, y0, z1, s);
}

/* Flat shadow ellipse lying on the bridge (drawn just before the ball). */
function spot(x, y, z, r, col) {
  const d = project(x, y, z, _p); if (d < 0) return;
  const f = newFace(), s = cam.foc / d;
  f.d = d - 0.5; f.kind = 1; f.c = col;
  f.p[0] = _p[0]; f.p[1] = _p[1]; f.p[2] = r * s; f.p[3] = r * s * 0.42;
}

function drawFaces() {
  const order = pool.slice(0, nF);
  order.sort((a, b) => b.d - a.d);
  for (const f of order) {
    const p = f.p;
    if (f.kind === 1) {                       // flat shadow on the bridge
      ctx.beginPath();
      ctx.ellipse(p[0], p[1], Math.max(1, p[2]), Math.max(1, p[3]), 0, 0, TAU);
      ctx.fillStyle = f.c;
      ctx.fill();
      continue;
    }
    if (f.kind === 3) {                       // the ball
      const d = project(p[0], p[1], p[2], _p);
      if (d < 0) continue;
      const r = Math.max(1.5, p[3] * cam.foc / d);
      const g = ctx.createRadialGradient(_p[0] - r * 0.34, _p[1] - r * 0.34, r * 0.18, _p[0], _p[1], r * 1.05);
      g.addColorStop(0, '#c6ff8a');
      g.addColorStop(0.55, '#7fd23f');
      g.addColorStop(1, '#3c7620');
      ctx.beginPath();
      ctx.arc(_p[0], _p[1], r, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = 'rgba(24,60,10,.7)';
      ctx.lineWidth = Math.max(1, r * 0.09);
      ctx.stroke();
      // speckles that rotate as the ball rolls
      const roll = +f.a;
      for (let k = 0; k < 4; k++) {
        const a = roll + k * 1.571, rr = r * (k % 2 ? 0.5 : 0.76), sz = Math.max(2, r * 0.22);
        ctx.fillStyle = k % 2 ? 'rgba(255,255,255,.3)' : 'rgba(30,70,12,.32)';
        ctx.fillRect(_p[0] + Math.cos(a) * rr - sz * 0.5, _p[1] + Math.sin(a) * rr * 0.9 - sz * 0.5, sz, sz);
      }
      continue;
    }
    if (f.kind === 4) {                       // portal glow
      const d = project(p[0], p[1], p[2], _p);
      if (d < 0) continue;
      const r = Math.max(2, p[3] * cam.foc / d), pl = +f.a;
      const g = ctx.createRadialGradient(_p[0], _p[1], 0, _p[0], _p[1], r);
      g.addColorStop(0, 'rgba(232,196,255,' + (0.2 + 0.5 * pl) + ')');
      g.addColorStop(0.45, 'rgba(160,90,246,' + (0.08 + 0.28 * pl) + ')');
      g.addColorStop(1, 'rgba(120,60,220,0)');
      ctx.fillStyle = g;
      ctx.fillRect(_p[0] - r, _p[1] - r, r * 2, r * 2);
      continue;
    }
    // Nudge every corner a hair away from the face centre: canvas antialiasing
    // otherwise leaves hairline seams between blocks that share an edge.
    const mx = (p[0] + p[2] + p[4] + p[6]) * 0.25, my = (p[1] + p[3] + p[5] + p[7]) * 0.25;
    ctx.beginPath();
    ctx.moveTo(p[0] + (p[0] - mx) * 0.012, p[1] + (p[1] - my) * 0.012);
    ctx.lineTo(p[2] + (p[2] - mx) * 0.012, p[3] + (p[3] - my) * 0.012);
    ctx.lineTo(p[4] + (p[4] - mx) * 0.012, p[5] + (p[5] - my) * 0.012);
    ctx.lineTo(p[6] + (p[6] - mx) * 0.012, p[7] + (p[7] - my) * 0.012);
    ctx.closePath();
    ctx.fillStyle = f.c;
    ctx.fill();
  }
}

/* ----------------------------- SKY -------------------------------- */
function drawSky(th) {
  const hz = clamp(cam.hz, 0, H);
  let g = ctx.createLinearGradient(0, 0, 0, Math.max(2, hz));
  g.addColorStop(0, th.sky[0]);
  g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, Math.max(0, hz));

  // Below the horizon there is no ground at all: the air just deepens.
  g = ctx.createLinearGradient(0, hz, 0, H);
  g.addColorStop(0, th.sky[1]);
  g.addColorStop(0.42, PAL.skyBelow);
  g.addColorStop(1, PAL.deep);
  ctx.fillStyle = g;
  ctx.fillRect(0, hz, W, H - hz);

  const m = Math.min(W, H);
  const sx0 = W * 0.74 + (cam.pitch - 0.4) * W * 0.35;
  const sy0 = hz * 0.42;
  if (PAL.star) {
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (let i = 0; i < 90; i++) {
      const h1 = hash2(i * 7.3, 1.1), h2 = hash2(i * 2.9, 5.4);
      const yy = h1 * hz - (cam.y * 0.012 + cam.pitch * 40) % 2500;
      const px = ((h2 * W) + i * 3.7) % W;
      const py = ((yy % hz) + hz) % hz;
      const s = h1 > 0.86 ? 2.4 : 1.5;
      ctx.fillRect(px, py, s, s);
    }
    ctx.fillStyle = 'rgba(226,232,255,.92)';
    ctx.fillRect(sx0 - m * 0.035, sy0 - m * 0.035, m * 0.07, m * 0.07);
    ctx.fillStyle = 'rgba(200,210,240,.55)';
    ctx.fillRect(sx0 - m * 0.015, sy0 - m * 0.028, m * 0.02, m * 0.02);
  } else {
    const r = m * 0.055;
    const gg = ctx.createRadialGradient(sx0, sy0, r * 0.4, sx0, sy0, r * 5);
    gg.addColorStop(0, 'rgba(255,246,190,.5)');
    gg.addColorStop(1, 'rgba(255,246,190,0)');
    ctx.fillStyle = gg;
    ctx.fillRect(sx0 - r * 5, sy0 - r * 5, r * 10, r * 10);
    ctx.fillStyle = 'rgba(255,244,170,.95)';
    ctx.fillRect(sx0 - r, sy0 - r, r * 2, r * 2);
  }
}

/* ------------------- ISLANDS AND CLOUDS BELOW --------------------- *
 * Deterministic decoration on a world grid: nothing is stored, the same
 * cell always grows the same island, and only cells inside the fog are
 * ever pushed at the renderer. */
const DECO_CX = 300, DECO_CY = 250;
function drawDecor() {
  const gy1 = Math.ceil((cam.y + FOG_CULL) / DECO_CY) * DECO_CY;
  const gx0 = Math.floor((cam.x - 1100) / DECO_CX), gx1 = Math.floor((cam.x + 1100) / DECO_CX);
  for (let gy = Math.floor(cam.y / DECO_CY) * DECO_CY; gy <= gy1; gy += DECO_CY) {
    for (let gx = gx0; gx <= gx1; gx++) {
      const h = hash2(gx * 1.37 + 3.1, gy * 2.11 + 7.7);
      if (h < 0.46) continue;
      const cloud = h > 0.74;
      const px = gx * DECO_CX + (hash2(gx * 3.3, gy * 1.9) - 0.5) * 190;
      const py = gy + (hash2(gx * 5.7, gy * 4.3) - 0.5) * 170;
      const pz = cloud ? -150 - hash2(gx * 7.1, gy * 2.3) * 300
                       : -70 - hash2(gx * 9.3, gy * 6.1) * 240;
      if (depthAt(px, py, pz) > FOG_CULL) continue;
      const bob = Math.sin(game.time * 0.45 + h * 12) * 7;
      const n = 3 + (((h * 10) | 0) % 4);
      for (let k = 0; k < n; k++) {
        const r = hash2(gx + k * 2.7, gy + k * 1.3);
        const s = 28 + r * 24;
        const ox = (k - n * 0.5) * s * 0.78 + (r - 0.5) * 22;
        const oy = (hash2(gx - k, gy + k) - 0.5) * s;
        const oz = bob + cloud * (hash2(k * 4.1, gx + gy) - 0.35) * 30;
        if (cloud) {
          const c0 = PAL.cloud[(k + ((h * 4) | 0)) % 3];
          box(px + ox, py + oy, pz + oz, s, s, s * 0.6, c0, shade(c0, 0.9), shade(c0, 0.82));
        } else {
          const g0 = PAL.grass[(k + ((h * 6) | 0)) % PAL.grass.length];
          const r0 = PAL.rock[(k + ((h * 5) | 0)) % PAL.rock.length];
          box(px + ox, py + oy, pz + oz, s, s, s * 0.9, g0, shade(r0, 0.85), r0);
        }
      }
    }
  }
}

/* ---------------------------- BRIDGE ------------------------------ */
function drawBridge(th, L) {
  const first = Math.floor(cam.y / BROW);
  const last = Math.ceil((cam.y + FOG_CULL) / BROW);
  for (let r = first; r <= last; r++) {
    const y = r * BROW;
    if (y < -BROW) continue;
    const c = cxAt(y, L), hw = halfAt(y, L);
    const half = Math.ceil(hw / BX);
    const fogT = (depthAt(c, y, 0) - FOG_START) / (FOG_END - FOG_START);
    if (fogT >= 0.995) continue;

    for (let i = -half; i <= half; i++) {
      const bx = c + i * BX;
      const h = hash2(bx * 0.31 + 0.5, y * 0.27 + 1.7);
      const col = PAL.path[(h * PAL.path.length) | 0];
      box(bx, y, 0, BX, BROW, PATH_TOP, col, null, null);
    }

    // The parapet sits flush with the outer deck block, so the bridge has no
    // visible seam and no hole where deck meets wall.
    const edge = half * BX + BX * 0.5;
    const wh = WALL_H * (0.7 + hash2(r * 1.7, 3.3) * 0.6);
    const eT = PAL.edge[(hash2(r * 2.3, 8.1) * PAL.edge.length) | 0];
    const eS = PAL.edge[(hash2(r * 3.1, 4.4) * PAL.edge.length) | 0];
    for (const sideSign of [-1, 1]) {
      const wx = c + sideSign * (edge + BX * 0.5);
      box(wx, y, PATH_TOP, BX, BROW, wh, eT, eS, shade(eS, 0.82));
    }
  }
}

/* ------------------ SLIDING BLOCKS AND THE PORTAL ----------------- */
function drawObstacles() {
  for (const o of game.obstacles) {
    const x = obstacleX(o), y = o.y;
    if (depthAt(x, y, 0) > FOG_CULL || depthAt(x, y, 0) < -140) continue;
    const base = rgbOf(o.kind === 0 ? '#5a5a66' : o.kind === 1 ? '#6b5a4a' : '#4a5a66');
    const lift = PATH_TOP + Math.sin(game.time * 2.4 + o.phase) * 1.5;
    spot(x, y, PATH_TOP + 1, o.w * 0.62, 'rgba(0,0,0,.22)');
    box(x, y, lift, o.w, 34, 30, shade(base, 1.2), base, shade(base, 0.78));
    box(x, y, lift + 30, o.w * 0.9, 12, 5, rgbOf('#ffdc5a'), rgbOf('#c9a72f'), null);
  }
}

function drawGate(th, L, portalT) {
  const gy = L.len, gx = cxAt(gy, L);
  const d = depthAt(gx, gy, PATH_TOP);
  if (d > FOG_CULL + 120 || d < -220) return;
  const hw = Math.min(halfAt(gy, L) - 2, 74), h = 96;
  const fr = rgbOf('#241436'), fr2 = rgbOf('#1b0f2b');
  const pulse = 0.55 + 0.45 * Math.sin(game.time * 3);

  quad(gx - hw, gy, PATH_TOP + 6, gx - hw, gy, PATH_TOP + 6 + h,
       gx + hw, gy, PATH_TOP + 6 + h, gx + hw, gy, PATH_TOP + 6, 'rgba(58,22,104,.95)');
  spot(gx, gy, PATH_TOP + 6 + h * 0.5, hw * 1.05, 'rgba(186,104,255,' + (0.2 + 0.18 * pulse) + ')');
  const f = newFace();
  f.d = d - 0.4; f.kind = 4; f.c = '';
  f.p[0] = gx; f.p[1] = gy; f.p[2] = PATH_TOP + 6 + h * 0.5; f.p[3] = hw * 0.55;
  f.a = String(pulse);

  // obsidian frame: two pillars and a lintel
  const fs = 18;
  for (let z = 0; z < h + fs; z += fs) {
    box(gx - hw - fs * 0.5, gy, PATH_TOP + z, fs, fs, fs, fr, fr2, fr2);
    box(gx + hw + fs * 0.5, gy, PATH_TOP + z, fs, fs, fs, fr, fr2, fr2);
  }
  for (let x = -hw - fs; x <= hw; x += fs) {
    box(gx + x, gy, PATH_TOP + h, fs, fs, fs, fr, fr2, fr2);
  }
  if (game.state === 'teleport') {
    for (let k = 0; k < 3; k++) {
      const t = (portalT * 1.3 + k / 3) % 1;
      spot(gx, gy, PATH_TOP + 6 + h * 0.5, 20 + t * 260, 'rgba(226,190,255,' + (1 - t) * 0.5 + ')');
    }
  }
}

/* ----------------------------- BALL ------------------------------- */
function drawBall(th) {
  const r = BALL_R * ballScale;
  const z = PATH_TOP + r;
  const d = depthAt(game.x, game.y, z);
  spot(game.x + r * 0.25, game.y + r * 0.3, PATH_TOP + 1.5, r * 1.02, 'rgba(0,0,0,.32)');
  if (d > FOG_CULL) return;
  const f = newFace();
  f.d = d; f.kind = 3;
  f.p[0] = game.x; f.p[1] = game.y; f.p[2] = z; f.p[3] = r;
  f.a = String(game.y / BALL_R);
}

/* --------------------------- VIGNETTE ----------------------------- */
function drawVignette(th) {
  const g = ctx.createRadialGradient(W / 2, H * 0.42, Math.min(W, H) * 0.28, W / 2, H * 0.5, Math.max(W, H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, th.vignette);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function render(portalT) {
  const L = level(), th = THEMES[L.theme];
  if (PAL.key !== th.sky[0] + th.sky[1]) buildPalette(th);
  nF = 0;
  aimCamera();
  if (game.shake) {
    cam.shx = (Math.random() - 0.5) * game.shake;
    cam.shy = (Math.random() - 0.5) * game.shake;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSky(th);
  drawDecor();
  drawBridge(th, L);
  drawObstacles();
  drawGate(th, L, portalT);
  drawBall(th);
  drawFaces();
  drawVignette(th);
}

/* ============================ AUDIO =============================== */
let actx = null, audioOn = true;
function beep(freq, dur, type, vol, slideTo) {
  if (!audioOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(40, slideTo), t + dur);
    g.gain.setValueAtTime(vol == null ? 0.05 : vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) { /* audio is a nicety, never fatal */ }
}

/* =========================== GAME FLOW ============================= */
let ballScale = 1;
let portalT = 0;

function startLevel() {
  const L = level();
  game.y = 0; game.scroll = 0;
  game.x = cxAt(0, L); game.vx = 0;
  game.camX = game.x; game.camY = game.y - H * 0.34;
  game.obstacles = buildObstacles(L);
  game.state = 'play'; game.stateT = 0;
  ballScale = 1; portalT = 0;
  UI.flash.style.opacity = '0';
  UI.lvlNum.textContent = String(game.level + 1);
  UI.lvlName.textContent = L.name;
  toast('LEVEL ' + (game.level + 1), L.name + '  ·  ' + L.obs + ' SLIDING BLOCKS');
}

function restartGame() {
  game.level = 0; game.bumps = 0;
  UI.bumps.textContent = '0';
  UI.center.classList.add('hidden');
  startLevel();
}

function win() {
  game.state = 'win';
  UI.centerH.innerHTML = 'YOU <span>WIN</span>';
  UI.centerP.innerHTML = 'You rolled all ' + LEVELS.length + ' levels.<br>Total bumps into the walls: <b>' + game.bumps + '</b><br><br>Scroll to go again.';
  UI.center.classList.remove('hidden');
  UI.flash.style.opacity = '0';
  beep(523, 0.12, 'square', 0.05);
  setTimeout(() => beep(659, 0.12, 'square', 0.05), 120);
  setTimeout(() => beep(784, 0.12, 'square', 0.05), 240);
  setTimeout(() => beep(1047, 0.3, 'square', 0.05), 360);
}

let toastTimer = 0;
function toast(big, small) {
  const t = document.getElementById('toast');
  t.querySelector('.lt').textContent = big;
  t.querySelector('.ls').textContent = small;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

function bump(strength) {
  game.bumps++;
  UI.bumps.textContent = String(game.bumps);
  game.shake = Math.min(16, strength);
  beep(110 + Math.random() * 30, 0.09, 'square', 0.045, 70);
  if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
}

/* ============================ UPDATE ============================== */
function update(dt) {
  const L = level();
  game.time += dt;
  game.shake = Math.max(0, game.shake - dt * 55);

  if (game.state === 'teleport') {
    game.stateT += dt;
    portalT = game.stateT;
    const gx = cxAt(L.len, L);
    const k = 1 - Math.exp(-dt * 7);
    game.x = lerp(game.x, gx, k);
    game.y = Math.min(L.len, game.y + 150 * dt);
    ballScale = Math.max(0.05, 1 - Math.pow(game.stateT / 1.15, 3));
    UI.flash.style.opacity = String(clamp((game.stateT - 0.2) / 0.5, 0, 1));
    game.camX = lerp(game.camX, game.x, 1 - Math.exp(-dt * 6));
    game.camY = lerp(game.camY, game.y - H * 0.34, 1 - Math.exp(-dt * 8));
    if (game.stateT > 1.2) {
      if (game.level + 1 >= LEVELS.length) { win(); return; }
      game.level++;
      startLevel();
    }
    return;
  }
  if (game.state !== 'play') { game.camX = lerp(game.camX, game.x, 1 - Math.exp(-dt * 4)); return; }

  // ---- scrolling drives the ball down the path ----
  let sc = 0;
  if (keys.down) sc += 1;
  if (keys.up) sc -= 1;
  if (sc) game.scroll = clamp(game.scroll + sc * 460 * dt, 0, L.len + 40);
  game.scroll = clamp(game.scroll, 0, L.len + 40);
  game.y = clamp(lerp(game.y, game.scroll, Math.min(1, dt * 15)), 0, L.len + 40);

  // ---- steering ----
  let ax = 0;
  if (keys.left) ax -= 1;
  if (keys.right) ax += 1;
  game.vx += ax * 10500 * dt;
  game.vx *= Math.exp(-dt * 14);
  game.vx = clamp(game.vx, -800, 800);
  game.x += game.vx * dt;
  game.bumpCd = Math.max(0, game.bumpCd - dt);

  // ---- sliding blocks ----
  for (const o of game.obstacles) {
    const ox = obstacleX(o);
    const dx = game.x - ox, dy = game.y - o.y;
    const hx = o.w / 2 + BALL_R, hy = o.h / 2 + BALL_R;
    if (Math.abs(dx) < hx && Math.abs(dy) < hy) {
      const px = hx - Math.abs(dx), py = hy - Math.abs(dy);
      if (px < py) {
        game.x = ox + Math.sign(dx || 1) * hx;
        game.vx = -game.vx * 0.4 + Math.sign(dx || 1) * 120;
      } else {
        game.y = o.y + Math.sign(dy || 1) * hy;
        game.scroll = clamp(game.y, 0, L.len + 40);
        // Sitting on top of a block: ease toward the open side so a run can
        // never dead-end on a block, even if the player does nothing.
        const r = blockRooms(o);
        const open = r.right >= r.left ? 1 : -1;
        game.x += open * 80 * dt;
      }
      if (game.bumpCd <= 0) { bump(16); game.bumpCd = 0.25; }
    }
  }

  // ---- walls of the wiggly corridor (last, so nothing can push you out) ----
  const c = cxAt(game.y, L);
  const hw = halfAt(game.y, L) - BALL_R;
  const d = game.x - c;
  if (Math.abs(d) > hw) {
    const side = Math.sign(d) || 1;
    game.x = c + side * hw;
    if (game.bumpCd <= 0) {                            // one bump per hit, not per frame
      bump(clamp(4 + Math.abs(game.vx) / 45, 5, 15));
      game.bumpCd = 0.25;
      game.scroll = Math.max(0, game.scroll - 4);
    }
    game.scroll = Math.max(0, game.scroll - 60 * dt);  // scraping the wall costs speed
    game.vx = -game.vx * 0.35 - side * 60;
  }

  // ---- camera ----
  game.camX = lerp(game.camX, game.x, 1 - Math.exp(-dt * 3.4));
  game.camY = lerp(game.camY, game.y - H * 0.34, 1 - Math.exp(-dt * 11));

  // ---- the portal ----
  if (game.y >= L.len - 26 && game.state === 'play') {
    game.state = 'teleport'; game.stateT = 0; portalT = 0;
    beep(300, 0.5, 'sine', 0.06, 1400);
    toast('TELEPORTING', 'LEVEL ' + (game.level + 1) + ' COMPLETE');
  }

  UI.fill.style.width = (clamp(game.y / L.len, 0, 1) * 100).toFixed(1) + '%';
}

/* ============================= INPUT ============================== */
function scrollInput(dy) {
  if (game.state === 'menu') { restartGame(); }
  if (game.state === 'win') { restartGame(); return; }
  if (game.state !== 'play') return;
  const L = level();
  game.scroll = clamp(game.scroll + dy, 0, L.len + 40);
  UI.hint.classList.add('dim');
}

window.addEventListener('wheel', e => {
  e.preventDefault();
  scrollInput(e.deltaY * 0.75);
}, { passive: false });

const KEYMAP = {
  ArrowLeft: 'left', a: 'left', A: 'left',
  ArrowRight: 'right', d: 'right', D: 'right',
  ArrowUp: 'up', w: 'up', W: 'up',
  ArrowDown: 'down', s: 'down', S: 'down',
};
window.addEventListener('keydown', e => {
  if (KEYMAP[e.key]) { keys[KEYMAP[e.key]] = true; e.preventDefault(); UI.hint.classList.add('dim'); }
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (game.state === 'menu' || game.state === 'win') restartGame();
  }
  if (e.key === 'r' || e.key === 'R') {
    if (game.state === 'teleport') return;
    game.level = game.level; game.bumps = game.bumps;
    startLevel();
  }
});
window.addEventListener('keyup', e => { if (KEYMAP[e.key]) keys[KEYMAP[e.key]] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let drag = null;
cvs.addEventListener('pointerdown', e => {
  if (game.state === 'menu' || game.state === 'win') { restartGame(); }
  drag = { x: e.clientX, y: e.clientY, id: e.pointerId };
  try { cvs.setPointerCapture(e.pointerId); } catch (err) {}
  UI.hint.classList.add('dim');
});
cvs.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (game.state !== 'play') return;
  scrollInput(-dy * 2.1);                       // drag up = roll down
  game.vx = clamp(game.vx + dx * 7, -430, 430);
});
cvs.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.id) drag = null; });
cvs.addEventListener('pointercancel', () => { drag = null; });
document.getElementById('startbtn').addEventListener('click', e => { e.stopPropagation(); restartGame(); });

/* ============================== LOOP ============================== */
let last = 0;
function frame(now) {
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016);
  last = now;
  update(dt);
  render(portalT);
  requestAnimationFrame(frame);
}

resize();
game.x = cxAt(0, level());
game.camX = game.x;
game.camY = game.y - H * 0.34;
requestAnimationFrame(frame);

/* Exposed for tests / tinkering from the console. */
window.BLOCKYROLL = { game, LEVELS, level, cxAt, screenOf, project, cam, PATH_TOP, PAL, halfAt, obstacleX, blockRooms, buildObstacles, GAP, BALL_R, startLevel, restartGame, update, render, keys, THEMES, get ballScale() { return ballScale; } };



</script>
